name: EditPreview
version: '${version}'
main: dev.twme.editpreview.EditPreviewPlugin
api-version: '1.21'
description: Block previews for WorldEdit / FAWE (-pev dry-runs, always-preview, live typing and brush previews)
authors: [TWME-TW]
# FAWE also declares provides: [WorldEdit]
depend: [WorldEdit]
commands:
  pev:
    description: WorldEdit preview
    usage: /pev help
    aliases: [editpreview]
    permission: editpreview.use
permissions:
  editpreview.use:
    description: Use previews
    default: true
