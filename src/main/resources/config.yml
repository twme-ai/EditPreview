# Max blocks captured per dry-run (writes beyond this are still not written, just not shown)
max-capture: 1000000
# Max fake blocks sent to a player (beyond this, the blocks nearest to the player are kept)
max-display: 150000
# Typing preview: paused when the selection is larger than this (Enter still dry-runs)
live-max-volume: 262144
# Brush preview: not shown for brushes larger than this
brush-max-size: 32
# Lime-glass flash when a selection is made
selection-flash:
  # duration in ticks (20 = 1 second)
  ticks: 60
  # selections larger than this don't flash
  max-volume: 262144
# Defaults for new players (each player can change them with /pev)
defaults:
  always: false
  brush: true
  selection-flash: true # independent of always-preview
  carve: true           # carve the preview around the player's line of sight and body
